name: SwarmBar
options:
  bundleIdPrefix: com.zach
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
targets:
  SwarmBar:
    type: application
    platform: macOS
    sources:
      - path: SwarmBar
        excludes:
          - Resources
      - path: SwarmBar/Resources
        buildPhase: resources
    info:
      path: SwarmBar/Info.plist
      properties:
        LSUIElement: true
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        NSAppleEventsUsageDescription: SwarmBar focuses the terminal tab running a session when you use Reply or Open in Terminal.
    dependencies:
      - sdk: libsqlite3.tbd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zach.SwarmBar
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        GENERATE_INFOPLIST_FILE: NO
  SwarmBarTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
        excludes:
          - Fixtures
      - path: Tests/Fixtures
        buildPhase: resources
    dependencies:
      - target: SwarmBar
    settings:
      base:
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/SwarmBar.app/Contents/MacOS/SwarmBar
        BUNDLE_LOADER: $(TEST_HOST)
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.zach.SwarmBarTests
schemes:
  SwarmBar:
    build:
      targets:
        SwarmBar: all
        SwarmBarTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SwarmBarTests

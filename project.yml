name: SwarmBar
options:
  bundleIdPrefix: app.swarmbar
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
targets:
  SwarmBar:
    type: application
    platform: macOS
    sources:
      - path: SwarmBar
        excludes:
          - Resources
      - path: SwarmBar/Resources
        buildPhase: resources
      # Listed one by one rather than globbing scripts/, because these are
      # the bridges IntegrationManager installs out of the bundle and
      # nothing else belongs in there. Globbing the directory meant every
      # new file beside them, including the release tooling, shipped inside
      # the app.
      - path: scripts/swarmbar-hook.sh
        buildPhase: resources
      - path: scripts/swarmbar-kimi-hook.sh
        buildPhase: resources
      - path: scripts/swarmbar-opencode.js
        buildPhase: resources
    info:
      path: SwarmBar/Info.plist
      properties:
        LSUIElement: true
        # Without this the app has no icon anywhere. LSUIElement hides that
        # for a long time, since there is no Dock tile to look wrong, but
        # notifications, System Settings and Force Quit all fall back to a
        # blank placeholder. Regenerate with scripts/make-icon.sh.
        CFBundleIconFile: AppIcon
        CFBundleShortVersionString: "0.1.1"
        CFBundleVersion: "2"
        NSAppleEventsUsageDescription: SwarmBar focuses the terminal tab running a session when you use Reply or Open in Terminal.
    dependencies:
      - sdk: libsqlite3.tbd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.swarmbar.SwarmBar
        # Off deliberately: the monitors read other tools' state
        # directories under ~/.claude, ~/.codex, ~/.gemini and the rest,
        # which a sandbox exists to prevent.
        ENABLE_APP_SANDBOX: NO
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: SwarmBar/SwarmBar.entitlements
      configs:
        # Development and CI: ad-hoc signed, no hardened runtime, no team.
        # A machine with no Developer ID can still build and test.
        Debug:
          ENABLE_HARDENED_RUNTIME: NO
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: "-"
        # Distribution. The hardened runtime is what notarization requires,
        # and it is also what makes the entitlements file load bearing:
        # without it SwarmBar could not send an Apple event to iTerm2, so
        # every approve, reply and focus would fail in the shipped build
        # while working in Debug.
        Release:
          ENABLE_HARDENED_RUNTIME: YES
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Developer ID Application"
          DEVELOPMENT_TEAM: 5JJ6G6A84S
  SwarmBarTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
        excludes:
          - Fixtures
      - path: Tests/Fixtures
        buildPhase: resources
    dependencies:
      - target: SwarmBar
    settings:
      base:
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/SwarmBar.app/Contents/MacOS/SwarmBar
        BUNDLE_LOADER: $(TEST_HOST)
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.swarmbar.SwarmBarTests
schemes:
  SwarmBar:
    build:
      targets:
        SwarmBar: all
        SwarmBarTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SwarmBarTests
    # scripts/build-app.sh archives before exporting a Developer ID app,
    # which needs the scheme to have an archive action.
    archive:
      config: Release

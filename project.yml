name: SwarmBar
options:
  bundleIdPrefix: com.zach
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
targets:
  SwarmBar:
    type: application
    platform: macOS
    sources:
      - path: SwarmBar
        excludes:
          - Resources
      - path: SwarmBar/Resources
        buildPhase: resources
    info:
      path: SwarmBar/Info.plist
      properties:
        LSUIElement: true
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zach.SwarmBar
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        GENERATE_INFOPLIST_FILE: NO

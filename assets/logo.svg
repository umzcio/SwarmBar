    <circle cx="15.2" cy="15.2" r="3.35"/>
    <circle cx="19" cy="21.78" r="3.35"/>
    <circle cx="11.4" cy="21.78" r="3.35"/>
    <circle cx="7.6" cy="15.2" r="3.35"/>
    <circle cx="22.8" cy="15.2" r="3.35"/>
